[workspace]
members = ["crates/orpheus-core", "crates/orpheus-tts", "crates/orpheus"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Orpheus"]
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
regex = "1"
unicode-segmentation = "1"
zip = "2"
quick-xml = "0.37"
scraper = "0.21"
html2text = "0.12"
epub = "2"
html-escape = "0.2"

orpheus-core = { path = "crates/orpheus-core" }
orpheus-tts = { path = "crates/orpheus-tts" }
